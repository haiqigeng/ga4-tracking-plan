name: Release package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff
          python -m playwright install --with-deps chromium
      - name: Validate package
        env:
          GA4_REQUIRE_BROWSER_E2E: "1"
        run: |
          ruff check .
          python -m compileall -q scripts skill/scripts skill/tests
          python -m unittest discover -s skill/tests
          python scripts/validate_package.py --release-tag "${{ github.event.release.tag_name }}"
      - name: Build release zip
        run: |
          python scripts/create_release_package.py --version "${{ github.event.release.tag_name }}"
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" release/*.zip --clobber
