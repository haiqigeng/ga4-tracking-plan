<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Window products</title></head>
  <body>
    <h1>Window category</h1>
    <label for="sort">Sort products</label>
    <select id="sort" name="sort_type">
      <option value="recommended">Recommended</option>
      <option value="price_ascending">Price ascending</option>
    </select>
    <div role="listbox" data-name="item_color" aria-label="Item color">
      <button type="button" role="option" data-value="white">White</button>
      <button type="button" role="option" data-value="black">Black</button>
      <button type="button" role="option" data-value="oak">Oak</button>
    </div>
  </body>
</html>
