<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Embedded support</title></head>
<body><form id="embedded-support"><label>Email <input type="email" required></label><button type="submit">Send support request</button></form>
<div class="form-success" hidden>Request received</div>
<script>
  document.getElementById("embedded-support").addEventListener("submit", event => {
    event.preventDefault();
    event.target.hidden = true;
    document.querySelector(".form-success").hidden = false;
  });
</script></body></html>
